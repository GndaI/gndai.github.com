<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">    
    <title>Sekai-Score Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ffcc;
            --secondary: #ff00ff;
            --danger: #ff4d4d;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --border: #333;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            min-height: 100vh;
        }

        .top-bar {
            width: 100%;
            max-width: 1300px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 10px;
        }

        .lang-switcher { display: flex; gap: 5px; }

        .stat-bar {
            width: 100%;
            max-width: 1300px;
            background: linear-gradient(90deg, #1e1e1e, #2a2a2a);
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: center;
            border: 1px solid var(--primary);
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.15);
        }

        .stat-label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 2px; }
        .stat-value { font-size: 1.6rem; font-weight: bold; color: var(--primary); }

        /* 모바일 탭 네비게이션 */
        .mobile-nav {
            display: none;
            width: 100%;
            max-width: 1300px;
            margin-bottom: 15px;
            gap: 5px;
        }
        .nav-btn {
            flex: 1;
            padding: 10px;
            background: #2a2a2a;
            color: #888;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
        }
        .nav-btn.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1300px;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        h2, h3 { margin: 0; color: var(--primary); }

        .filter-section {
            background: #181818;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #252525;
        }

        /* 수치 직접 입력 + 슬라이더 */
        .level-input-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            margin-bottom: 8px;
        }
        .level-input-container input[type="number"] {
            width: 55px;
            padding: 5px;
            background: #2a2a2a;
            border: 1px solid var(--border);
            color: var(--primary);
            font-weight: bold;
            border-radius: 6px;
            text-align: center;
        }

        .multi-range {
            position: relative;
            height: 6px;
            background: #333;
            border-radius: 3px;
            flex-grow: 1;
        }
        .multi-range input[type="range"] {
            position: absolute;
            width: 100%;
            height: 6px;
            top: 0;
            left: 0;
            margin: 0;
            background: none;
            pointer-events: none;
            -webkit-appearance: none;
        }
        .multi-range input[type="range"]::-webkit-slider-thumb {
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: var(--primary);
            pointer-events: auto;
            -webkit-appearance: none;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        .checkbox-group { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .checkbox-group label {
            display: flex; align-items: center; gap: 4px; background: #2a2a2a; 
            padding: 5px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; border: 1px solid var(--border);
        }

        /* 패턴 요소 아코디언 */
        details.el-accordion {
            background: #222;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 8px 12px;
            margin-top: 10px;
        }
        details.el-accordion summary {
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            color: #ddd;
            user-select: none;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        details.el-accordion summary::-webkit-details-marker { display: none; }
        details.el-accordion summary::after { content: "▼"; font-size: 10px; color: var(--primary); }
        details.el-accordion[open] summary::after { content: "▲"; }

        .el-filter-group { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; max-height: 200px; overflow-y: auto; }
        
        /* 3단 토글 버튼 스타일 */
        .el-btn {
            background: #1a1a1a; color: #888; border: 1px solid #333;
            border-radius: 12px; padding: 4px 9px; font-size: 11px; cursor: pointer; transition: 0.2s;
            user-select: none;
        }
        .el-btn.include { background: #1b3a2b; color: var(--primary); font-weight: bold; border-color: var(--primary); }
        .el-btn.exclude { background: #3a1b1b; color: var(--danger); font-weight: bold; border-color: var(--danger); }

        .sort-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .sort-btn {
            background: #2a2a2a;
            color: #ccc;
            border: 1px solid #444;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .sort-btn.active {
            border-color: var(--primary);
            color: var(--primary);
            font-weight: bold;
            background: #223330;
        }

        #song-search-input, #history-search-input {
            width: 100%; padding: 10px;
            background: #2a2a2a; border: 1px solid var(--border);
            color: white; border-radius: 8px;
        }

        .song-list-scroll {
            max-height: 500px; overflow-y: auto;
            border: 1px solid var(--border); border-radius: 8px; background: #141414;
        }

        .song-option {
            display: flex; align-items: center; padding: 10px;
            cursor: pointer; border-bottom: 1px solid #222; transition: 0.2s;
        }
        .song-option:hover { background: #262626; }
        .song-option img { width: 55px; height: 55px; border-radius: 6px; margin-right: 12px; object-fit: cover; background: #333; }
        .song-option-info { flex-grow: 1; min-width: 0; }

        .title-main { font-weight: bold; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .title-sub { font-size: 11px; color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .badge-lv {
            display: inline-block;
            background: #222;
            border: 1px solid var(--primary);
            color: var(--primary);
            border-radius: 5px;
            padding: 1px 5px;
            font-size: 11px;
            font-weight: bold;
            margin-right: 4px;
        }

        .status-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: bold;
            padding: 1px 5px;
            border-radius: 4px;
            margin-left: 4px;
        }
        .badge-ap { background: #ff007f; color: #fff; }
        .badge-fc { background: #00cc66; color: #000; }

        .selected-song-display {
            display: flex; gap: 15px; background: #252525;
            padding: 12px; border-radius: 10px; align-items: center;
        }
        #selected-jacket { width: 70px; height: 70px; border-radius: 8px; background: #333; object-fit: cover; }

        .pattern-info-card {
            background: #181818; border: 1px solid #333; border-radius: 10px;
            padding: 12px; font-size: 12px; line-height: 1.5;
        }
        .pattern-info-card h4 { margin: 0 0 8px 0; color: var(--primary); font-size: 13px; border-bottom: 1px solid #2a2a2a; padding-bottom: 4px; }
        .info-row { margin-bottom: 4px; word-break: break-word; }
        .info-label { font-weight: bold; color: #aaa; display: inline-block; min-width: 130px; }

        .input-group { display: flex; align-items: center; margin-bottom: 8px; }
        .input-group label { width: 90px; font-weight: bold; font-size: 13px; }
        .input-group input { flex: 1; padding: 8px; background: #2a2a2a; border: 1px solid var(--border); color: white; border-radius: 6px; }

        .diff-btn {
            padding: 5px 8px; border-radius: 5px; background: #333; color: #888;
            cursor: pointer; font-size: 11px; font-weight: bold; border: 1px solid #444; transition: all 0.2s;
        }
        .diff-btn input { display: none; }
        .diff-btn:has(input:checked)[data-diff="EASY"]   { background: #66ccff; color: #000; border-color: #66ccff; }
        .diff-btn:has(input:checked)[data-diff="NORMAL"] { background: #66ff66; color: #000; border-color: #66ff66; }
        .diff-btn:has(input:checked)[data-diff="HARD"]   { background: #ffcc66; color: #000; border-color: #ffcc66; }
        .diff-btn:has(input:checked)[data-diff="EXPERT"] { background: #ff6666; color: #fff; border-color: #ff6666; }
        .diff-btn:has(input:checked)[data-diff="MASTER"] { background: #cc66ff; color: #fff; border-color: #cc66ff; }
        .diff-btn:has(input:checked)[data-diff="APPEND"] { background: #ff66cc; color: #fff; border-color: #ff66cc; }

        button { cursor: pointer; padding: 10px 15px; border: none; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .btn-primary { background: var(--primary); color: #000; }
        .btn-load { background: #444; color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-lang { background: #333; color: #ccc; border: 1px solid #444; }
        .btn-lang.active { border-color: var(--primary); color: var(--primary); }

        .result-box {
            background: #000; padding: 12px; border-radius: 10px;
            text-align: center; border-left: 5px solid var(--primary);
        }
        #result-score { font-size: 22px; font-weight: bold; color: var(--primary); }
        #potential-val { font-size: 15px; color: var(--secondary); }

        .history-list-scroll { max-height: 400px; overflow-y: auto; border: 1px solid #333; border-radius: 8px; background: #141414; }
        .history-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid var(--border); font-size: 12px; gap: 10px; }
        .history-item img { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; background: #333; }
        .history-info { flex-grow: 1; min-width: 0; }

        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
        }
        
        .diff-EASY { color: #33ccff; } .diff-NORMAL { color: #22ee88; } .diff-HARD { color: #ffbb00; }
        .diff-EXPERT { color: #ff4466; } .diff-MASTER { color: #bb33ff; } .diff-APPEND { color: #ff77cc; }
        
        .spinner { width: 45px; height: 45px; border: 4px solid #333; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 세로 모드 / 모바일 대응 스타일 */
        @media (max-width: 900px) {
            .main-container { grid-template-columns: 1fr; }
            .mobile-nav { display: flex; }
            .tab-page { display: none; }
            .tab-page.active { display: flex; flex-direction: column; gap: 12px; }
        }
    </style>
</head>
<body>
<div class="stat-bar">
    <div class="stat-item">
        <span class="stat-label" id="t-stat-label">Top 50 Avg Rating (적용 레벨 기준)</span>
        <span id="top50-avg" class="stat-value">0.000</span>
    </div>
</div>

<!-- 모바일/세로화면 전용 탭 네비게이션 -->
<div class="mobile-nav">
    <button class="nav-btn active" id="tab-btn-songs" onclick="switchTab('songs')">곡 선택</button>
    <button class="nav-btn" id="tab-btn-calc" onclick="switchTab('calc')">계산기</button>
    <button class="nav-btn" id="tab-btn-history" onclick="switchTab('history')">등록된 기록</button>
</div>

<div id="loading" class="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">Synchronizing Global Data...</div>
</div>

<div id="main-content" class="main-container" style="display:none;">

    <!-- 1. 곡 선택 섹션 -->
    <div class="card tab-page active" id="page-songs">
        <h2 id="t-heading-songs">곡 선택</h2>
        <div class="filter-section">
            <div style="font-size:12px; font-weight:bold; color:var(--primary);" id="t-range-title">난이도 범위 조절 (Lv.1 ~ 38)</div>
            
            <div class="level-input-container">
                <input type="number" id="num-min" min="1" max="38" value="1" onchange="onNumInputChange('min')">
                <div class="multi-range">
                    <input type="range" id="slider-min" min="1" max="38" value="1" oninput="onRangeSliderChange('min')">
                    <input type="range" id="slider-max" min="1" max="38" value="38" oninput="onRangeSliderChange('max')">
                </div>
                <input type="number" id="num-max" min="1" max="38" value="38" onchange="onNumInputChange('max')">
            </div>

            <div class="checkbox-group" id="diff-checkboxes">
                <label class="diff-btn" data-diff="EASY"><input type="checkbox" value="EASY" onchange="filterSongs()">EASY</label>
                <label class="diff-btn" data-diff="NORMAL"><input type="checkbox" value="NORMAL" onchange="filterSongs()">NORMAL</label>
                <label class="diff-btn" data-diff="HARD"><input type="checkbox" value="HARD" onchange="filterSongs()">HARD</label>
                <label class="diff-btn" data-diff="EXPERT"><input type="checkbox" value="EXPERT" onchange="filterSongs()">EXPERT</label>
                <label class="diff-btn" data-diff="MASTER"><input type="checkbox" value="MASTER" checked onchange="filterSongs()">MASTER</label>
                <label class="diff-btn" data-diff="APPEND"><input type="checkbox" value="APPEND" checked onchange="filterSongs()">APPEND</label>
            </div>

            <details class="el-accordion">
                <summary id="t-el-summary">패턴 요소 필터링</summary>
                <div style="font-size:10px; color:#888; margin-top:5px;" id="t-el-help">클릭 1회: 포함(Green) | 클릭 2회: 제외(Red) | 클릭 3회: 해제</div>
                <div class="el-filter-group" id="el-filter-buttons"></div>
            </details>
        </div>

        <div class="sort-bar">
            <span style="font-size:12px; color:#aaa;" id="t-sort-label">정렬:</span>
            <button class="sort-btn active" id="sort-song-official" onclick="setSongSort('official')"><span id="t-sort-off">공식 난이도</span> <span class="arrow">▲</span></button>
            <button class="sort-btn" id="sort-song-applied" onclick="setSongSort('applied')"><span id="t-sort-app">적용 난이도</span> <span class="arrow">▲</span></button>
            <button class="sort-btn" id="sort-song-title" onclick="setSongSort('title')"><span id="t-sort-tit">곡명</span> <span class="arrow">▲</span></button>
            <button class="sort-btn" id="sort-song-score" onclick="setSongSort('score')"><span id="t-sort-sco">점수</span> <span class="arrow">▲</span></button>
            <button class="sort-btn" id="sort-song-rating" onclick="setSongSort('rating')"><span id="t-sort-rat">레이팅</span> <span class="arrow">▲</span></button>
        </div>

        <input type="text" id="song-search-input" placeholder="곡명으로 검색..." oninput="filterSongs()">
        <div id="song-list" class="song-list-scroll"></div>
    </div>

    <!-- 2. 계산기 & 곡 정보 섹션 -->
    <div class="card tab-page" id="page-calc">
        <h2 id="t-heading-calc">계산기 & 상세 정보</h2>
        
        <div class="selected-song-display" id="selected-song-ui">
            <img id="selected-jacket" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='70' height='70' viewBox='0 0 70 70'><rect width='100%' height='100%' fill='%23333'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%23888' font-size='12'>No Image</text></svg>" alt="jacket">
            <div class="selected-info-text">
                <div id="selected-title" style="font-weight:bold; font-size:14px;">곡을 선택하세요</div>
                <div id="selected-diff" style="font-size:12px; margin-top:4px;">-</div>
                <div id="selected-meta" style="font-size: 11px; color: #aaa; margin-top: 4px;"></div>
            </div>
        </div>

        <div class="pattern-info-card">
            <h4 id="t-detail-title">상세 채보 정보</h4>
            <div class="info-row"><span class="info-label" id="t-lbl-applevel">적용 레벨:</span> <span id="info-applied-fc" style="color:var(--primary); font-weight:bold;">-</span></div>
            <div class="info-row"><span class="info-label" id="t-lbl-el">패턴 요소:</span> <span id="info-el">-</span></div>
            <div class="info-row"><span class="info-label" id="t-lbl-mm">패턴 설명:</span> <span id="info-mm">-</span></div>
        </div>

        <div class="result-box">
            <div id="result-score">0</div>
            <div id="potential-val">Rating: 0.00</div>
        </div>

        <div id="input-fields">
            <div class="input-group"><label>Perfect</label><input type="number" id="perf" readonly></div>
            <div class="input-group"><label>Great</label><input type="number" id="great" value="0" oninput="calculate()"></div>
            <div class="input-group"><label>Good</label><input type="number" id="good" value="0" oninput="calculate()"></div>
            <div class="input-group"><label>Bad</label><input type="number" id="bad" value="0" oninput="calculate()"></div>
            <div class="input-group"><label>Miss</label><input type="number" id="miss" value="0" oninput="calculate()"></div>
        </div>

        <button class="btn-primary" style="width: 100%; margin-top:5px;" id="t-save" onclick="saveRecord()">결과 등록하기</button>
        <button class="btn-load" style="width: 100%;" id="t-reset" onclick="resetInputs()">초기화</button>
    </div>

    <!-- 3. 기록실 섹션 -->
    <div class="card tab-page" id="page-history">
        <h3 id="t-history">등록된 기록</h3>
        
        <!-- 기록실 전용 난이도 필터 UI 추가 -->
        <div class="filter-section" style="margin-bottom: 10px;">
            <div style="font-size:12px; font-weight:bold; color:var(--primary);">기록 난이도 범위 조절 (Lv.1 ~ 38)</div>
            
            <div class="level-input-container">
                <input type="number" id="rec-num-min" min="1" max="38" value="1" onchange="onRecNumInputChange('min')">
                <div class="multi-range">
                    <input type="range" id="rec-slider-min" min="1" max="38" value="1" oninput="onRecRangeSliderChange('min')">
                    <input type="range" id="rec-slider-max" min="1" max="38" value="38" oninput="onRecRangeSliderChange('max')">
                </div>
                <input type="number" id="rec-num-max" min="1" max="38" value="38" onchange="onRecNumInputChange('max')">
            </div>

            <div class="checkbox-group" id="rec-diff-checkboxes">
                <label class="diff-btn" data-diff="EASY"><input type="checkbox" value="EASY" checked onchange="renderHistory()">EASY</label>
                <label class="diff-btn" data-diff="NORMAL"><input type="checkbox" value="NORMAL" checked onchange="renderHistory()">NORMAL</label>
                <label class="diff-btn" data-diff="HARD"><input type="checkbox" value="HARD" checked onchange="renderHistory()">HARD</label>
                <label class="diff-btn" data-diff="EXPERT"><input type="checkbox" value="EXPERT" checked onchange="renderHistory()">EXPERT</label>
                <label class="diff-btn" data-diff="MASTER"><input type="checkbox" value="MASTER" checked onchange="renderHistory()">MASTER</label>
                <label class="diff-btn" data-diff="APPEND"><input type="checkbox" value="APPEND" checked onchange="renderHistory()">APPEND</label>
            </div>
        </div>
        <div class="sort-bar">
            <button class="sort-btn active" id="sort-rec-recent" onclick="setRecordSort('recent')"><span id="t-rec-rec">최근 등록순</span> <span class="arrow">▼</span></button>
            <button class="sort-btn" id="sort-rec-official" onclick="setRecordSort('official')"><span id="t-rec-off">공식 난이도</span> <span class="arrow">▲</span></button>
            <button class="sort-btn" id="sort-rec-applied" onclick="setRecordSort('applied')"><span id="t-rec-app">적용 난이도</span> <span class="arrow">▲</span></button>
            <button class="sort-btn" id="sort-rec-score" onclick="setRecordSort('score')"><span id="t-rec-sco">점수</span> <span class="arrow">▲</span></button>
            <button class="sort-btn" id="sort-rec-rating" onclick="setRecordSort('rating')"><span id="t-rec-rat">레이팅</span> <span class="arrow">▲</span></button>
            <button class="sort-btn" id="sort-rec-title" onclick="setRecordSort('title')"><span id="t-rec-tit">곡명</span> <span class="arrow">▲</span></button>
        </div>

        <div style="display:flex; gap:6px;">
            <button class="sort-btn" id="btn-filter-fc" onclick="toggleRecordFilter('FC')">FULL COMBO 만 보기</button>
            <button class="sort-btn" id="btn-filter-ap" onclick="toggleRecordFilter('AP')">ALL PERFECT 만 보기</button>
        </div>

        <input type="text" id="history-search-input" placeholder="기록 검색..." oninput="renderHistory()">
        
        <div id="history-list" class="history-list-scroll"></div>

        <div style="margin-top:5px; display:flex; gap:5px;">

    function getJacketUrl(songId) {
        const formattedId = String(songId).padStart(3, '0');
        return `./assets/jackets/jacket_s_${formattedId}.webp`;
    }

    function parseFcDifficulty(fcStr, officialLevel) {
        if (!fcStr || fcStr.trim() === '' || fcStr.trim() === '-') {
            return { raw: String(officialLevel), num: Number(officialLevel) };
        }
        const cleaned = fcStr.replace(/[^0-9.]/g, '');
        const numVal = parseFloat(cleaned);
        return {
            raw: fcStr,
            num: isNaN(numVal) ? Number(officialLevel) : numVal
        };
    }

    async function fetchSongData() {
        try {
            const cacheBust = `?t=${Date.now()}`;
            const [songsRes, statsRes] = await Promise.all([
                fetch('./assets/songs.json' + cacheBust).then(r => r.json()),
                fetch('./assets/songs_stats.json' + cacheBust).then(r => r.json()).catch(() => [])
            ]);

            const statsMap = {};
            if (Array.isArray(statsRes)) {
                statsRes.forEach(st => { statsMap[String(st.id)] = st; });
            }

            const diffKeys = ['EASY', 'NORMAL', 'HARD', 'EXPERT', 'MASTER', 'APPEND'];
            const allElementsSet = new Set();

            allSongs = [];
            songsRes.forEach(s => {
                const sId = String(s.id);
                const stats = statsMap[sId] || {};

                diffKeys.forEach(diff => {
                    const lvKey = diff.toLowerCase();
                    const lv = s.levels ? s.levels[lvKey] : null;

                    if (lv !== null && lv !== undefined) {
                        const noteKey = diffNoteMap[diff];
                        const noteVal = s[noteKey] !== undefined ? Number(s[noteKey]) || 0 : 0;
                        const officialLv = Number(lv);

                        let rawFc = '';
                        if (diff === 'EXPERT') rawFc = s.ex_fc;
                        else if (diff === 'MASTER') rawFc = s.mas_fc;
                        else if (diff === 'APPEND') rawFc = s.apd_fc;

                        const fcObj = parseFcDifficulty(rawFc, officialLv);

                        let elVal = '';
                        if (diff === 'EXPERT') elVal = stats.ex_el || '';
                        else if (diff === 'MASTER') elVal = stats.mas_el || '';
                        else if (diff === 'APPEND') elVal = stats.apd_el || '';

                        const rawElList = elVal.split(',').map(e => e.trim()).filter(e => e.length > 0 && e !== '-');
                        const normalizedElList = Array.from(new Set(rawElList.map(e => normalizeElTag(e))));
                        
                        normalizedElList.forEach(e => allElementsSet.add(e));

                        allSongs.push({
                            id: `${sId}-${diff}`,
                            musicId: sId,
                            titleJp: s.title_jp || s.title_ko,
                            titleKo: s.title_ko || '',
                            titleHangul: s.title_hangul || '',
                            level: officialLv,
                            fcLevelRaw: fcObj.raw,
                            fcLevelNum: fcObj.num,
                            difficulty: diff,
                            totalNotes: noteVal,
                            bpm: s.bpm || '-',
                            length: s.length || '-',
                            unit: s.unit_code || '',
                            jacket: getJacketUrl(sId),
                            elements: normalizedElList,
                            stats: stats
                        });
                    }
                });
            });

            const targetCategories = [
                '부등호', '손교차', '라인 변경', '인식난', '계단/트릴', 
                '폭타/물량', '연타', '동치', '박자난', '변속/기믹', 
                '플릭/트레이스', '슬라이드/이동', '스윙 리듬', '장시간', '개인차'
            ];
            renderElFilterButtons(targetCategories);
            setLang('ko');
            document.getElementById('loading').style.display = 'none';
            document.getElementById('main-content').style.display = 'grid';
        } catch (e) {
            console.error("데이터 동기화 실패: ", e);
            document.getElementById('loading-text').innerText = "Data Synchronization Failed.";
        }
    }

    function renderElFilterButtons(elements) {
        const container = document.getElementById('el-filter-buttons');
        container.innerHTML = elements.map(el => `
            <button class="el-btn" data-el="${el}" onclick="toggleElFilterState('${el}')">${el}</button>
        `).join('');
    }

    /* 3단계 패턴 요소 필터링 토글: OFF -> include(포함) -> exclude(제외) -> OFF */
    function toggleElFilterState(el) {
        const currentState = elFilterStates.get(el);
        if (!currentState) {
            elFilterStates.set(el, 'include');
        } else if (currentState === 'include') {
            elFilterStates.set(el, 'exclude');
        } else {
            elFilterStates.delete(el);
        }

        const btn = document.querySelector(`.el-btn[data-el="${el}"]`);
        if (btn) {
            btn.classList.remove('include', 'exclude');
            const newState = elFilterStates.get(el);
            if (newState) btn.classList.add(newState);
        }
        filterSongs();
    }

    function updateRangeUI(minVal, maxVal) {
        minVal = Math.max(1, Math.min(38, Math.round(minVal)));
        maxVal = Math.max(1, Math.min(38, Math.round(maxVal)));

        if (minVal > maxVal) {
            const temp = minVal; minVal = maxVal; maxVal = temp;
        }

        document.getElementById('slider-min').value = minVal;
        document.getElementById('slider-max').value = maxVal;
        document.getElementById('num-min').value = minVal;
        document.getElementById('num-max').value = maxVal;

        filterSongs();
    }

                const arrowSpan = btn.querySelector('.arrow');
                if (arrowSpan) {
                    arrowSpan.innerText = isActive ? (songSortAsc ? '▲' : '▼') : '▲';
                }
            });
        } else if (target === 'record') {
            const keys = ['recent', 'official', 'applied', 'score', 'rating', 'title'];
            keys.forEach(k => {
                const btn = document.getElementById(`sort-rec-${k}`);
                if (!btn) return;
                const isActive = (recordSortKey === k);
                btn.classList.toggle('active', isActive);
                const arrowSpan = btn.querySelector('.arrow');
                if (arrowSpan) {
                    arrowSpan.innerText = isActive ? (recordSortAsc ? '▲' : '▼') : '▲';
                }
            });
        }
    }

    function filterSongs() {
        const minLv = parseInt(document.getElementById('num-min').value) || 1;
        const maxLv = parseInt(document.getElementById('num-max').value) || 38;
        const keyword = document.getElementById('song-search-input').value.toLowerCase();
        
        const activeDiffs = Array.from(document.querySelectorAll('#diff-checkboxes input:checked')).map(cb => cb.value);
        const listDiv = document.getElementById('song-list');
        
        const includeEls = [];
        const excludeEls = [];
        elFilterStates.forEach((state, el) => {
            if (state === 'include') includeEls.push(el);
            else if (state === 'exclude') excludeEls.push(el);
        });

        let filtered = allSongs.filter(s => {
            const matchLevel = s.level >= minLv && s.level <= maxLv;
            const matchDiff = activeDiffs.includes(s.difficulty);
            const matchKeyword = s.titleJp.toLowerCase().includes(keyword) || 
                                 s.titleKo.toLowerCase().includes(keyword) || 
                                 s.titleHangul.toLowerCase().includes(keyword);
            
            // 제외 필터링 (하나라도 들어있으면 제외)
            if (excludeEls.length > 0) {
                const hasExcluded = excludeEls.some(ex => s.elements.includes(ex));
                if (hasExcluded) return false;
            }

            // 포함 필터링 (OR 방식: 선택 요소 중 하나라도 포함되면 통과)
            let matchEl = true;
            if (includeEls.length > 0) {
                matchEl = includeEls.some(inc => s.elements.includes(inc));
            }

            return matchLevel && matchDiff && matchKeyword && matchEl;
        });

        filtered.sort((a, b) => {
            let res = 0;
            const recA = userRecords[a.id];
            const recB = userRecords[b.id];

            if (songSortKey === 'official') {
                if (a.level !== b.level) res = a.level - b.level;
                else if (a.fcLevelNum !== b.fcLevelNum) res = a.fcLevelNum - b.fcLevelNum;
                else res = difficultyOrder[a.difficulty] - difficultyOrder[b.difficulty];
            } else if (songSortKey === 'applied') {
                if (a.fcLevelNum !== b.fcLevelNum) res = a.fcLevelNum - b.fcLevelNum;
                else res = a.level - b.level;
            } else if (songSortKey === 'title') {
                res = a.titleJp.localeCompare(b.titleJp);
            } else if (songSortKey === 'score') {
                const scA = recA ? recA.score : -1;
                const scB = recB ? recB.score : -1;
                res = scA - scB;
            } else if (songSortKey === 'rating') {
                const rtA = recA ? recA.rating : -1;
                const rtB = recB ? recB.rating : -1;
                res = rtA - rtB;
            }

            return songSortAsc ? res : -res;
        });

        const fallbackImg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='55' height='55' viewBox='0 0 55 55'><rect width='100%' height='100%' fill='%23333'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%23888' font-size='10'>No Img</text></svg>";

        listDiv.innerHTML = filtered.map(s => {
            const rec = userRecords[s.id];
            let statusBadge = '';
            let scoreDisplay = '';

            if (rec) {
                const d = rec.details || {};
                const isAp = (d.great === 0 && d.good === 0 && d.bad === 0 && d.miss === 0);
                const isFc = (!isAp && (d.good || 0) === 0 && (d.bad || 0) === 0 && (d.miss || 0) === 0);

                if (isAp) statusBadge = `<span class="status-badge badge-ap">AP</span>`;
                else if (isFc) statusBadge = `<span class="status-badge badge-fc">FC</span>`;
                
                scoreDisplay = `<span style="color:var(--primary); font-size:11px; font-weight:bold; margin-left:6px;">BEST: ${rec.score.toLocaleString()}</span>`;
            }

            return `
            <div class="song-option" onclick="selectSong('${s.id}')">
                <img src="${s.jacket}" loading="lazy" onerror="this.onerror=null; this.src='${fallbackImg}';">
                <div class="song-option-info">
                    ${generateTitleHtml(s)}
                    <div style="margin-top: 4px; font-size:12px;">
                        <span class="badge-lv">Lv.${s.level}</span>
                        <span style="color:#aaa; font-size:11px;">적용: ${s.fcLevelRaw}</span> | 
                        <span class="diff-${s.difficulty}">[${s.difficulty}]</span>
                        ${statusBadge}
                        ${scoreDisplay}
                    </div>
                </div>
            </div>
        `}).join('');
    }

    function selectSong(id) {
        currentSong = allSongs.find(s => s.id === id);
        if(!currentSong) return;
        
        const fallbackImg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='70' height='70' viewBox='0 0 70 70'><rect width='100%' height='100%' fill='%23333'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%23888' font-size='12'>No Image</text></svg>";
        
        const jacketEl = document.getElementById('selected-jacket');
        jacketEl.src = currentSong.jacket;
        jacketEl.onerror = () => { jacketEl.onerror = null; jacketEl.src = fallbackImg; };

        document.getElementById('selected-title').innerHTML = generateTitleHtml(currentSong);
        
        const diffDisplay = document.getElementById('selected-diff');
        diffDisplay.className = `diff-${currentSong.difficulty}`;
        diffDisplay.innerHTML = `<span class="badge-lv">Lv.${currentSong.level}</span> 적용 레벨: ${currentSong.fcLevelRaw} [${currentSong.difficulty}]`;
        
        document.getElementById('selected-meta').innerText = `⏱ 곡 길이: ${currentSong.length} | 🥁 BPM: ${currentSong.bpm} | Notes: ${currentSong.totalNotes || '미정'}`;

        document.getElementById('info-applied-fc').innerText = `${currentSong.fcLevelRaw} (계산 적용 레벨: ${currentSong.fcLevelNum})`;

        const st = currentSong.stats || {};
        const diff = currentSong.difficulty;

        let elVal = '-';
        let mmVal = '-';

        if (diff === 'EXPERT') { elVal = st.ex_el || '-'; mmVal = st.ex_mm || '-'; } 
        else if (diff === 'MASTER') { elVal = st.mas_el || '-'; mmVal = st.mas_mm || '-'; } 
        else if (diff === 'APPEND') { elVal = st.apd_el || '-'; mmVal = st.apd_mm || '-'; }

        if (elVal !== '-') {
            elVal = elVal.split(',').map(e => normalizeElTag(e.trim())).join(', ');
        }

        document.getElementById('info-el').innerText = elVal;
        document.getElementById('info-mm').innerText = mmVal;

        resetInputs();

        // 모바일 스크린인 경우 곡 선택 시 자동으로 계산기 탭으로 전환
        if (window.innerWidth <= 900) {
            switchTab('calc');
        }
    }

    function updateRecRangeUI(minVal, maxVal) {
        minVal = Math.max(1, Math.min(38, Math.round(minVal)));
        maxVal = Math.max(1, Math.min(38, Math.round(maxVal)));

        if (minVal > maxVal) {
            const temp = minVal; minVal = maxVal; maxVal = temp;
        }

        document.getElementById('rec-slider-min').value = minVal;
        document.getElementById('rec-slider-max').value = maxVal;
        document.getElementById('rec-num-min').value = minVal;
        document.getElementById('rec-num-max').value = maxVal;

        renderHistory();
    }

    function onRecRangeSliderChange(changed) {
        let minVal = parseInt(document.getElementById('rec-slider-min').value);
        let maxVal = parseInt(document.getElementById('rec-slider-max').value);
        updateRecRangeUI(minVal, maxVal);
    }

    function onRecNumInputChange(changed) {
        let minVal = parseInt(document.getElementById('rec-num-min').value) || 1;
        let maxVal = parseInt(document.getElementById('rec-num-max').value) || 38;
        updateRecRangeUI(minVal, maxVal);
    }

    function resetInputs() {
        if (!currentSong) return;
        document.getElementById('perf').value = currentSong.totalNotes;
        ['great', 'good', 'bad', 'miss'].forEach(id => document.getElementById(id).value = 0);
        calculate();
    }

    function calculate() {
        if (!currentSong) return { score: 0, rating: 0 };

        let g = +document.getElementById('great').value;
        let gd = +document.getElementById('good').value;
        let b = +document.getElementById('bad').value;
        let m = +document.getElementById('miss').value;
        const total = currentSong.totalNotes || 1;

        if (g + gd + b + m > total) {
            const activeEl = document.activeElement;
            if (activeEl && activeEl.type === 'number') {
                const otherSums = (g + gd + b + m) - (+activeEl.value);
                activeEl.value = total - otherSums;
                g = +document.getElementById('great').value;
                gd = +document.getElementById('good').value;
                b = +document.getElementById('bad').value;
                m = +document.getElementById('miss').value;
            }
        }

        const p = total - (g + gd + b + m);
        document.getElementById('perf').value = p;

        const score = Math.floor(((p + g/2 + gd/4 + b/8) / total) * 10000000);
        document.getElementById('result-score').innerText = score.toLocaleString();

        let rating = 0;
        const baseLevel = parseFloat(currentSong.fcLevelNum); 
        if (score >= 9800000) { 
            rating = baseLevel + (score - 9800000) / 100000; 
        } else { 
            rating = (baseLevel - 2) + (score - 9500000) / 150000; 
        }
        if (rating < 0) rating = 0;

        document.getElementById('potential-val').innerText = `Rating (적용 기준): ${rating.toFixed(2)}`;
        return { score, rating };
    }

    function saveRecord() {
        if (!currentSong) return;
        const { score, rating } = calculate();
        
        const details = { 
            great: +document.getElementById('great').value, 
            good: +document.getElementById('good').value, 
            bad: +document.getElementById('bad').value, 
            miss: +document.getElementById('miss').value 
        };

        userRecords[currentSong.id] = {
            id: currentSong.id,
            musicId: currentSong.musicId,
            name: currentSong.titleJp,
            diff: currentSong.difficulty,
            level: currentSong.level,
            fcLevel: currentSong.fcLevelRaw,
            score: score,
            rating: Number(rating.toFixed(2)),
            details: details,
            date: Date.now()
        };
        
        localStorage.setItem('pjsekai_records', JSON.stringify(userRecords));
        filterSongs();
        renderHistory();
        switchTab('songs');
    }

    function updateRatingDashboard() {
        const records = Object.values(userRecords);
        const top50 = records.sort((a,b) => b.rating - a.rating).slice(0, 50);
        const avg = top50.reduce((acc, cur) => acc + parseFloat(cur.rating), 0) / (50);
        
        const display = document.getElementById('top50-avg');
        if(display) {
            display.innerText = avg.toFixed(3);
        }
    }

    function renderHistory() {
        const list = document.getElementById('history-list');
        const searchKeyword = document.getElementById('history-search-input').value.toLowerCase();

        const minLv = parseInt(document.getElementById('rec-num-min').value) || 1;
        const maxLv = parseInt(document.getElementById('rec-num-max').value) || 38;
        const activeDiffs = Array.from(document.querySelectorAll('#rec-diff-checkboxes input:checked')).map(cb => cb.value);

        let records = Object.values(userRecords).map(r => {
            const originalSong = allSongs.find(s => s.id === r.id);
            return { ...r, songRef: originalSong };
        });

        // 2. 수정: 레벨 및 난이도 필터링 조건 추가
        records = records.filter(r => {
            if (!r.songRef) return false;
            const targetSong = r.songRef;

            const matchLevel = targetSong.level >= minLv && targetSong.level <= maxLv;
            const matchDiff = activeDiffs.includes(r.diff);
            const matchKeyword = targetSong.titleJp.toLowerCase().includes(searchKeyword) ||
                                targetSong.titleKo.toLowerCase().includes(searchKeyword) ||
                                targetSong.titleHangul.toLowerCase().includes(searchKeyword);

            return matchLevel && matchDiff && matchKeyword;
        });

        if (recordFilterType !== 'ALL') {
            records = records.filter(r => {
                const d = r.details || {};
                const isAp = (d.great === 0 && d.good === 0 && d.bad === 0 && d.miss === 0);
                const isFc = (d.good || 0) === 0 && (d.bad || 0) === 0 && (d.miss || 0) === 0;

                if (recordFilterType === 'AP') return isAp;
                if (recordFilterType === 'FC') return isFc;
                return true;
            });
        }

        records.sort((a, b) => {
            let res = 0;
            if (recordSortKey === 'recent') {
                res = (a.date || 0) - (b.date || 0);
            } else if (recordSortKey === 'official') {
                res = a.level - b.level;
            } else if (recordSortKey === 'applied') {
                const numA = a.songRef ? a.songRef.fcLevelNum : a.level;
                const numB = b.songRef ? b.songRef.fcLevelNum : b.level;
                res = numA - numB;
            } else if (recordSortKey === 'score') {
                res = a.score - b.score;
            } else if (recordSortKey === 'rating') {
                res = a.rating - b.rating;
            } else if (recordSortKey === 'title') {
                res = a.name.localeCompare(b.name);
            }

            return recordSortAsc ? res : -res;
        });

        const fallbackImg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 40 40'><rect width='100%' height='100%' fill='%23333'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%23888' font-size='8'>No Img</text></svg>";

        list.innerHTML = records.map(r => {
            const jacketUrl = r.songRef ? r.songRef.jacket : fallbackImg;
            const d = r.details || {};
            const isAp = (d.great === 0 && d.good === 0 && d.bad === 0 && d.miss === 0);
            const isFc = (!isAp && (d.good || 0) === 0 && (d.bad || 0) === 0 && (d.miss || 0) === 0);

            let statusBadge = '';
            if (isAp) statusBadge = `<span class="status-badge badge-ap">AP</span>`;
            else if (isFc) statusBadge = `<span class="status-badge badge-fc">FC</span>`;

            return `
                <div class="history-item">
                    <img src="${jacketUrl}" onerror="this.onerror=null; this.src='${fallbackImg}';">
                    <div class="history-info">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <strong style="flex:1;">${r.songRef ? generateTitleHtml(r.songRef) : r.name} ${statusBadge}</strong>
                            <span style="font-size: 10px; color: #666;">${r.date ? new Date(r.date).toLocaleDateString() : ''}</span>
                        </div>
                        <div style="margin-top:3px;">
                            <small class="diff-${r.diff}"><span class="badge-lv">Lv.${r.level}</span> [${r.diff}] (적용: ${r.fcLevel || r.level})</small><br>
                            <span>${parseInt(r.score).toLocaleString()}</span> | 
                            <span style="color:var(--secondary); font-weight:bold;">Rating: ${r.rating.toFixed(2)}</span>
                        </div>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:3px;">
                        <button class="btn-load" style="font-size:10px; padding:3px 6px;" onclick="loadRecord('${r.id}')">${i18n[currentLang].load}</button>
                        <button class="btn-danger" style="font-size:10px; padding:3px 6px;" onclick="deleteRecord('${r.id}')">${i18n[currentLang].delete}</button>
                    </div>
                </div>
            `;
        }).join('');

        updateRatingDashboard();
    }

    function loadRecord(id) {
        const record = userRecords[id];
        if (!record) return;
        selectSong(id);
        if (record.details) {
            document.getElementById('great').value = record.details.great;
            document.getElementById('good').value = record.details.good;
            document.getElementById('bad').value = record.details.bad;
            document.getElementById('miss').value = record.details.miss;
        }
        calculate();
        if (window.innerWidth <= 900) {
            switchTab('calc');
        } else {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function deleteRecord(id) {
        if (confirm(i18n[currentLang].confirmDel)) {
            delete userRecords[id];
            localStorage.setItem('pjsekai_records', JSON.stringify(userRecords));
            filterSongs();
            renderHistory();
        }
    }

    function exportData() {
        const dataStr = JSON.stringify(userRecords, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `sekai_records_${new Date().getTime()}.json`;
        link.click();
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const imported = JSON.parse(e.target.result);
                userRecords = { ...userRecords, ...imported };
                localStorage.setItem('pjsekai_records', JSON.stringify(userRecords));
                filterSongs();
                renderHistory();
                alert(i18n[currentLang].alertImport);
            } catch (err) {
                alert("Error importing file.");
            }
        };
        reader.readAsText(file);
    }

    fetchSongData();
</script>

</body>
